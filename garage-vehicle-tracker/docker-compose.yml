version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: garage-vehicle-tracker_web_1
      APP_PORT: 3000

  web:
    image: node:20-alpine
    restart: on-failure
    working_dir: /app
    command: sh -c "[ -d node_modules ] || npm install --omit=dev --no-audit --no-fund; node server.js"
    stop_grace_period: 30s
    depends_on:
      - db
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: garage
      DB_PASSWORD: ${APP_SEED}
      DB_NAME: garage
    volumes:
      - ${APP_DATA_DIR}/server:/app

  db:
    image: mysql:8.0
    restart: on-failure
    stop_grace_period: 1m
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --performance-schema=OFF
      --innodb-buffer-pool-size=128M
    environment:
      MYSQL_ROOT_PASSWORD: ${APP_SEED}
      MYSQL_DATABASE: garage
      MYSQL_USER: garage
      MYSQL_PASSWORD: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
