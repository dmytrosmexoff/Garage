<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учёт обслуживания транспорта</title>
<style>
:root{color-scheme:light dark;--bg:#e8ecef;--panel:#f6f8f9;--ink:#1b2733;--mute:#5d6b78;--line:#cfd7dd;--acc:#1f5f7a;--ok:#2e7d4f;--soon:#b87b00;--bad:#b3341f;--none:#8a97a3;--onacc:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141b21;--panel:#1d262e;--ink:#e4eaee;--mute:#93a1ad;--line:#2f3b45;--acc:#5fb0cf;--ok:#5cc08a;--soon:#e0aa3a;--bad:#ee7a63;--none:#6f7d89;--onacc:#0c1419}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Bahnschrift,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:21px;margin:0 0 10px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px}
button.p{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border-radius:999px}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.info{color:var(--mute);margin:0 0 12px;font-size:13.5px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.bar label{width:140px}
.sp{flex:1}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.doc{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--none);border-radius:6px;padding:10px 12px}
.doc.ok{border-left-color:var(--ok)}.doc.soon{border-left-color:var(--soon)}.doc.bad{border-left-color:var(--bad)}
.doc b{display:block}.doc .st{font-size:13px;font-weight:600}
.doc.ok .st{color:var(--ok)}.doc.soon .st{color:var(--soon)}.doc.bad .st{color:var(--bad)}
.sum{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.chip{border-radius:999px;padding:5px 12px;font-size:13px}
.chip.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.chip b{margin-left:4px}
h2{font-size:15px;margin:22px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--ink)}
.row{display:grid;grid-template-columns:1fr 150px auto;gap:6px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--none);border-radius:6px;padding:9px 12px;margin-bottom:6px}
.row.ok{border-left-color:var(--ok)}.row.soon{border-left-color:var(--soon)}.row.bad{border-left-color:var(--bad)}
.nm{font-weight:600}.meta{font-size:12.5px;color:var(--mute)}
.row .st{font-size:12.5px;font-weight:600}
.row.ok .st{color:var(--ok)}.row.soon .st{color:var(--soon)}.row.bad .st{color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--none)}
.row.ok .prog i{background:var(--ok)}.row.soon .prog i{background:var(--soon)}.row.bad .prog i{background:var(--bad)}
.acts{display:flex;gap:6px}.acts button{padding:5px 10px;font-size:13px}
.empty{color:var(--mute);padding:30px 0;text-align:center}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:18px;width:min(440px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 4px;font-size:17px}
.lead{margin:0 0 12px;font-size:13px;color:var(--mute)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f .w{grid-column:1/-1}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0 0}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.hint{font-size:12px;color:var(--mute);margin-top:30px}
.meta{overflow-wrap:anywhere}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:8px 0 22px}
.hero h1{font-size:42px;margin:0;letter-spacing:-.5px;line-height:1.1}.hero p{margin:6px 0 0;color:var(--mute);font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 12px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--ink)}
.tile svg{width:100%;max-width:190px;height:auto;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tile svg .w{fill:var(--panel)}.tile svg .h{fill:var(--acc);stroke:none}
.tile b{font-size:21px}.tile span{font-size:13px;color:var(--mute)}
.tile:hover{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.panel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:16px}
.gh{display:flex;justify-content:space-between;align-items:end;margin-top:28px;margin-bottom:8px}.gh h2{margin:0;border:0}
.gv{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:6px}
.gv small{display:block;color:var(--mute)}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;margin-left:4px;white-space:nowrap}
.badge.bad{color:var(--bad)}.badge.soon{color:var(--soon)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}.top h1{margin:0}
.hint2{font-size:12.5px;color:var(--mute);margin:6px 0 0}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:12px}
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.ctl button{padding:4px 10px;font-size:13px}
#chart{width:100%;height:auto;touch-action:pan-y;cursor:grab;display:block;user-select:none}
.sumtxt{margin:6px 0 0;font-size:13.5px}
.lg{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.lg button{padding:3px 9px;font-size:12.5px}
.setrow{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.setrow span{display:block;color:var(--mute);font-size:13px}.btnr{display:flex;gap:6px}
button.danger{color:var(--bad);border-color:var(--bad)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.sync{position:fixed;left:10px;bottom:8px;font-size:11px;color:var(--mute);z-index:5}.sync.bad{color:var(--bad)}body.rep .sync{display:none}.toast.bad{background:var(--bad);color:#fff}
@media (max-width:620px){.tiles{grid-template-columns:1fr}.hero h1{font-size:34px}.lg{grid-template-columns:1fr 1fr auto}.lg span:nth-child(3){display:none}.setrow{flex-direction:column;align-items:stretch}}
#rep{display:none;background:#fff;color:#111;color-scheme:light;font:600 13px/1.45 "Lucida Grande","Lucida Sans Unicode","Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;padding:16px;max-width:900px;margin:0 auto}
body.rep{background:#fff}body.rep .wrap{display:none}body.rep #rep{display:block}
.rtool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px;margin-bottom:14px;background:#e8ecef;border-radius:8px}

#rep table{width:100%;border-collapse:collapse;margin-bottom:6px}
#rep th,#rep td{border:1px solid #999;padding:3px 6px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
#rep th{background:#eee}#rep .num{text-align:right;white-space:nowrap}#rep a{color:#0b4f8a}#rep tr{break-inside:avoid}
#rep .kv td:first-child{width:38%;font-weight:600}
#rep .s-bad{font-weight:700;color:#a11}#rep .s-soon{font-weight:700;color:#8a5a00}
.auth{max-width:460px;margin:30px auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.auth h1{font-size:24px;margin:0 0 6px}
.form{display:grid;gap:10px;margin:12px 0}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}.chk input{width:auto}
.msg{font-size:13px;margin:6px 0;min-height:18px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.btnr{flex-wrap:wrap}
#dBody{max-height:62vh;overflow:auto;padding-right:4px}
.f h4{grid-column:1/-1;margin:10px 0 0;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:3px}
.mbig{display:grid;grid-template-columns:1fr minmax(250px,320px);gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.mbig .left{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.mbig label{max-width:260px}
.dmini{display:flex;flex-direction:column;gap:6px}
.dm{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-left:5px solid var(--none);border-radius:6px;padding:5px 10px;font-size:12.5px;line-height:1.3}
.dm.ok{border-left-color:var(--ok)}
.dm.soon{background:#b36b00;border-color:#b36b00;color:#fff}.dm.bad{background:#b3341f;border-color:#b3341f;color:#fff}
.dm button{padding:3px 9px;font-size:12px}
.dm.soon button,.dm.bad button{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.7)}
.acts .gear{padding:4px 8px;font-size:16px;line-height:1}
details.adv{margin-top:26px}details.adv summary{cursor:pointer;color:var(--mute);margin-bottom:8px}
#rep h1,#rep h2,#rep h3,#rep th{font-weight:700}
#rep .box{display:inline-block;width:17px;height:17px;border:2px solid #111;border-radius:3px}
#rep td.cb{width:26px;text-align:center}#rep td.blank{min-width:150px;height:38px}
#rep tr.opt td{color:#444}
#rep .tag{display:inline-block;font-size:10.5px;border:1px solid #666;border-radius:9px;padding:0 6px;margin-left:6px;font-weight:700}
#rep .tag.must{border-color:#a11;color:#a11}
#rep .det{font-size:11.5px;color:#333}#rep .sub{font-size:11px;color:#444}
#rep .cnote{border:1px solid #999;padding:6px 8px;min-height:38px;margin:6px 0;white-space:pre-wrap}
.rtool .rnote{flex:1 1 240px;background:#fff;color:#111;border:1px solid #999;border-radius:6px;padding:6px 8px;width:auto}
@media (max-width:620px){.mbig{grid-template-columns:1fr}}
@media print{.sync,.toast{display:none}.rtool{display:none}#rep{padding:0;max-width:none}@page{margin:12mm}}
@media (max-width:620px){.row{grid-template-columns:1fr}.acts{justify-content:flex-end}.docs{grid-template-columns:1fr}}
</style>
</head>

function build(type){
  const out=[];
  for(const cat in TPL[type]||{})TPL[type][cat].split(';').forEach(s=>{const p=s.split('|');out.push({id:uid(),cat,name:p[0],km:+p[1],mo:+p[2],lastKm:null,lastDate:null,note:''})});
  return out;
}
function itemStatus(it,odo){
  if(it.lastKm==null&&!it.lastDate)return{k:'none',t:'нет данных',p:0};
  if(!it.km&&!it.mo)return{k:'none',t:'без интервала',p:0};
  let r=0,left=null;
  if(it.km&&it.lastKm!=null){const u=odo-it.lastKm;r=u/it.km;left=it.km-u}
  if(it.mo&&it.lastDate)r=Math.max(r,(Date.now()-Date.parse(it.lastDate))/2629800000/it.mo);
  const k=r>=1?'bad':r>=.8?'soon':'ok';
  let t=k==='bad'?'просрочено':k==='soon'?'скоро':'в норме';
  if(left!=null)t+=left<0?` (на ${fmt(-left)} км)`:` (ещё ${fmt(left)} км)`;
  return{k,t,p:Math.min(r,1)*100,left,r};
}
function docStatus(d){
  if(!d||!d.end)return{k:'none',t:'Дата не задана'};
  const n=Math.round((Date.parse(d.end)-Date.parse(today()))/864e5);
  if(n<0)return{k:'bad',t:`Просрочено на ${-n} дн.`};
  const k=d.end<=addMonths(today(),1)?'bad':d.end<=addMonths(today(),3)?'soon':'ok';
  return{k,t:n===0?'Истекает сегодня':`Осталось ${n} дн.`};
}
function owned(v){
  const m=Math.max(0,Math.floor((Date.now()-Date.parse(v.buyDate))/2629800000)),y=Math.floor(m/12),r=m%12;
  return [y?y+' г.':'',r||!y?r+' мес.':''].filter(Boolean).join(' ');
}

// ---- учёт пробега: запись = {d: дата, odo: показание на конец дня, trip: км за день} ----
const recalc=v=>{const L=v.log;L.sort((a,b)=>a.d.localeCompare(b.d));L.forEach((e,i)=>e.trip=i?e.odo-L[i-1].odo:null);v.odo=L[L.length-1].odo};
function setReading(v,d,r){
  const L=v.log,p=L.filter(e=>e.d<d).length-1,i=L.findIndex(e=>e.d===d);
  if(p<0)return 'Дата раньше начала учёта ('+dfmt(L[0].d)+')';
  const prev=L[p].odo;if(r<prev)return `Показание меньше предыдущего (${fmt(prev)} км)`;
  const nx=L.find(e=>e.d>d);if(nx&&r>nx.odo)return `Показание больше следующей записи (${fmt(nx.odo)} км)`;
  if(i>=0)L[i].odo=r;else L.push({d,odo:r,trip:0});
  recalc(v);return 0;
}
function addTrip(v,d,t){
  const L=v.log,p=L.filter(e=>e.d<d).length-1;
  if(p<0)return 'Дата раньше начала учёта ('+dfmt(L[0].d)+')';
  if(!(t>0))return 'Введите число километров больше нуля';
  const i=L.findIndex(e=>e.d===d);
  if(i>=0)L[i].odo+=t;else L.push({d,odo:L[p].odo+t,trip:0});
  L.forEach(e=>{if(e.d>d)e.odo+=t});
  recalc(v);return 0;
}

function chartDays(v){
  const L=v.log,map={},res=[];L.forEach(e=>map[e.d]=e);
  const last=Math.max(Date.parse(today()),Date.parse(L[L.length-1].d));let odo=L[0].odo;
  for(let t=Date.parse(L[0].d);t<=last;t+=864e5){const d=new Date(t).toISOString().slice(0,10),e=map[d];if(e)odo=e.odo;res.push({d,trip:e&&e.trip!=null?e.trip:0,odo})}
  return res;
}
function setRange(k){const N=CD.length;CH.n=k==='all'?N:+k;CH.a=N-CH.n;CH.sel=-1;drawChart()}
function zoomBy(f,fr=.5){fr=Math.max(0,Math.min(1,fr));const o=CH.n;CH.n=Math.max(Math.min(7,CD.length),Math.min(CD.length,o*f));CH.a+=(o-CH.n)*fr;drawChart()}
function drawChart(){
  const N=CD.length;CH.n=Math.max(Math.min(7,N),Math.min(CH.n,N));CH.a=Math.max(0,Math.min(CH.a,N-CH.n));
  const W=800,Ht=300,ml=46,mr=10,mt=12,mb=28,pw=W-ml-mr,ph=Ht-mt-mb,i0=Math.floor(CH.a),i1=Math.min(N,Math.ceil(CH.a+CH.n)),vis=CD.slice(i0,i1);
  const mx=Math.max(10,...vis.map(d=>d.trip)),pp=Math.pow(10,Math.floor(Math.log10(mx))),ym=[1,2,2.5,5,10].find(f=>f*pp>=mx)*pp,bw=pw/CH.n;
  let g='',bars='',lab='';const st=Math.max(1,Math.ceil(CH.n/6));
  for(let k=0;k<=4;k++){const y=mt+ph-ph*k/4;g+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${ml-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mute)">${fmt(Math.round(ym*k/4*10)/10)}</text>`}
  vis.forEach((d,j)=>{const i=i0+j,x=ml+(i-CH.a)*bw,h=d.trip?Math.max(1,d.trip/ym*ph):0;
    bars+=`<rect x="${x+bw*.1}" y="${mt+ph-h}" width="${Math.max(1,bw*.8)}" height="${h}" fill="${i===CH.sel?'var(--soon)':'var(--acc)'}"/>`;
    if(i%st===0)lab+=`<text x="${x+bw/2}" y="${Ht-8}" text-anchor="middle" font-size="11" fill="var(--mute)">${d.d.slice(8)}.${d.d.slice(5,7)}</text>`});
  $('chart').innerHTML=`<defs><clipPath id="cp"><rect x="${ml}" y="0" width="${pw}" height="${Ht}"/></clipPath></defs>${g}<g clip-path="url(#cp)">${bars}${lab}</g>`;
  const sum=vis.reduce((a,d)=>a+d.trip,0),top=vis.reduce((a,d)=>d.trip>a.trip?d:a,vis[0]),sel=CD[CH.sel];
  $('chSum').textContent=`За период (${vis.length} дн.): ${fmt(sum)} км, в среднем ${fmt(Math.round(sum/vis.length))} км в день, максимум ${fmt(top.trip)} км (${dfmt(top.d)}).`;
  $('chInfo').textContent=sel?`${dfmt(sel.d)}: проехано ${fmt(sel.trip)} км, одометр ${fmt(sel.odo)} км`:'Нажмите на столбец, чтобы увидеть день. Колесо мыши, щипок и кнопки +/− меняют масштаб, перетаскивание сдвигает график.';
}
function initChart(){
  CD=chartDays(V());CH={a:CD.length-30,n:30,sel:-1};drawChart();
  const sv=$('chart'),pts=new Map();let moved=false,pin=0,sx=0;
  const geo=e=>{const r=sv.getBoundingClientRect();return{fr:((e.clientX-r.left)/r.width*800-46)/744,k:800/r.width/744}};
  const pick=e=>{const fr=geo(e).fr,i=Math.floor(CH.a+fr*CH.n);if(fr>=0&&fr<=1&&i>=0&&i<CD.length&&CH.sel!==i){CH.sel=i;drawChart()}};
  const dist=()=>{const a=[...pts.values()];return Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY)};
  sv.onpointerdown=e=>{sv.setPointerCapture(e.pointerId);pts.set(e.pointerId,e);moved=false;sx=e.clientX;if(pts.size===2)pin=dist()};
  sv.onpointermove=e=>{
    if(!pts.has(e.pointerId))return pick(e);
    const o=pts.get(e.pointerId);pts.set(e.pointerId,e);
    if(pts.size===2){const d=dist();if(pin&&d>0)zoomBy(pin/d,geo(e).fr);pin=d;moved=true;return}
    if(Math.abs(e.clientX-sx)>4)moved=true;
    if(moved){CH.a-=(e.clientX-o.clientX)*geo(e).k*CH.n;drawChart()}
  };
  sv.onpointerup=e=>{if(!moved)pick(e);pts.delete(e.pointerId);pin=0};
  sv.onpointercancel=e=>{pts.delete(e.pointerId);pin=0};
  sv.onwheel=e=>{e.preventDefault();zoomBy(e.deltaY>0?1.25:.8,geo(e).fr)};
}

function renderCheck(v){
  const L=RL,t=RT[L],c=CK[L],loc=L==='ja'?'ja-JP':'ru-RU';
  const nf=n=>Number(n).toLocaleString(loc),df=d=>d?new Date(d).toLocaleDateString(loc,{timeZone:'UTC'}):'—',tr=s=>L==='ja'?(JA[s]||s):s;
  const iv=it=>[it.km?nf(it.km)+' '+t.km:'',it.mo?it.mo+' '+t.mo:''].filter(Boolean).join(' / ')||t.cond;
  const why=it=>{
    const a=[];
    if(it.km&&it.lastKm!=null)a.push(c.km(v.odo-it.lastKm,it.km,nf));
    if(it.mo&&it.lastDate)a.push(c.mo(Math.round((Date.now()-Date.parse(it.lastDate))/2629800000*10)/10,it.mo));
    return a.join('<br>')||'—';
  };
  const must=[],opt=[],nod=[];
  v.items.forEach(it=>{
    const s=itemStatus(it,v.odo);
    if(s.k==='none'){if(RNONE&&(it.km||it.mo)&&!H(it).length)nod.push({it,s});return}
    if(s.r>=1)must.push({it,s});else if(RSOON&&s.r>=.9)opt.push({it,s});
  });
  must.sort((a,b)=>b.s.r-a.s.r);opt.sort((a,b)=>b.s.r-a.s.r);
  const row=({it},kind)=>{
    const h=H(it),e=h[h.length-1];
    const tag=kind==='must'?c.tagM:kind==='opt'?c.tagO:c.tagN;
    return `<tr class="${kind==='opt'?'opt':''}"><td class="cb"><span class="box"></span></td><td>${esc(tr(it.name))}<span class="tag ${kind==='must'?'must':''}">${tag}</span><div class="sub">${esc(tr(it.cat))}</div></td>
    <td>${kind==='nod'?c.nd(iv(it)):why(it)}</td><td>${e?df(e.d)+(e.km!=null?', '+nf(e.km)+' '+t.km:'')+(detStr(e.x,L)?`<div class="det">${esc(detStr(e.x,L))}</div>`:''):'—'}</td><td class="blank"></td></tr>`;
  };
  const table=(title,list,kind)=>list.length?`<h2>${title}</h2><table><tr><th></th><th>${c.work}</th><th>${c.why}</th><th>${c.prev}</th><th>${c.mech}</th></tr>${list.map(x=>row(x,kind)).join('')}</table>`:'';
  $('rep').lang=L;
  $('rep').innerHTML=`${toolbar()}
  <h1>${c.title}</h1>
  <table class="kv"><tr><td>${c.veh}</td><td>${esc(v.name)}, ${t.types[v.type]||''}</td></tr>
  <tr><td>${c.mil}</td><td>${nf(v.odo)} ${t.km}${v.off?` (${c.panel}: ${nf(v.odo-v.off)} ${t.km})`:''}</td></tr>
  <tr><td>${c.date}</td><td>${df(today())}</td></tr></table>
  <h2>${c.wish}</h2><div class="cnote" id="cNote">${esc(RNOTE)}</div>
  ${table(c.must,must,'must')}${table(c.opt,opt,'opt')}${table(c.nod,nod,'nod')}
  ${must.length+opt.length+nod.length?'':`<p>${c.none}</p>`}`;
}

function renderReport(){
  const v=V();if(!v)return;
  if(RMODE==='check')return renderCheck(v);
  const L=RL,t=RT[L],loc=L==='ja'?'ja-JP':'ru-RU';
  const nf=n=>Number(n).toLocaleString(loc),df=d=>d?new Date(d).toLocaleDateString(loc,{timeZone:'UTC'}):'—';
  const mon=n=>n==null?'—':nf(n)+' '+esc(v.cc||'¥'),tr=s=>L==='ja'?(JA[s]||s):s;
  const iv=it=>[it.km?nf(it.km)+' '+t.km:'',it.mo?it.mo+' '+t.mo:''].filter(Boolean).join(' / ')||t.cond;
  const mm=Math.max(0,Math.floor((Date.now()-Date.parse(v.buyDate))/2629800000)),y=Math.floor(mm/12),r=mm%12;
  const own=L==='ja'?`${y?y+t.y:''}${r||!y?r+t.m:''}`:[y?y+' '+t.y:'',r||!y?r+' '+t.m:''].filter(Boolean).join(' ');
  const ds=k=>{const d=v.docs[k];if(!d.end)return t.notSet;const n=Math.round((Date.parse(d.end)-Date.parse(today()))/864e5);return df(d.end)+' ('+(n<0?t.over(-n):t.left(n))+')'+(d.note?', '+lk(d.note):'')};
  const groups={},hist=[];let total=0;
  v.items.forEach(it=>{const h=H(it),c=h.reduce((a,e)=>a+(e.cost||0),0);total+=c;h.forEach(e=>hist.push({...e,cat:it.cat,name:it.name}));(groups[it.cat]=groups[it.cat]||[]).push({it,h,c,s:itemStatus(it,v.odo)})});
  hist.sort((a,b)=>(a.d||'').localeCompare(b.d||'')||(a.km||0)-(b.km||0));
  const catRows=Object.keys(groups).map(c=>[c,groups[c].reduce((a,x)=>a+x.c,0)]).filter(x=>x[1]>0);
  const stTbl=Object.keys(groups).map(cat=>{
    const rows=groups[cat].filter(x=>RALL||x.h.length);
    if(!rows.length)return'';
    return `<h3>${esc(tr(cat))}</h3><table><tr><th>${t.item}</th><th>${t.iv}</th><th>${t.last}</th><th>${t.status}</th><th>${t.cost}</th></tr>`+rows.map(({it,h,c,s})=>{
      const e=h[h.length-1];
      const kl=s.left==null?'':(s.left<0?(L==='ja'?` (${nf(-s.left)}${t.km}超過)`:` (на ${nf(-s.left)} ${t.km} сверх)`):(L==='ja'?` (残り${nf(s.left)}${t.km})`:` (ещё ${nf(s.left)} ${t.km})`));
      return `<tr><td>${esc(tr(it.name))}</td><td>${iv(it)}</td><td>${e?df(e.d)+(e.km!=null?', '+nf(e.km)+' '+t.km:''):'—'}${h.length>1?` (${t.cnt}: ${h.length})`:''}</td><td class="s-${s.k}">${t.st[s.k]}${kl}</td><td class="num">${c?mon(c):'—'}</td></tr>`}).join('')+'</table>'}).join('');
  const hTbl=hist.length?`<table><tr><th>${t.date}</th><th>${t.mil}</th><th>${t.item}</th><th>${t.cost}</th><th>${t.cmt}</th></tr>`+hist.map(e=>`<tr><td>${df(e.d)}</td><td class="num">${e.km!=null?nf(e.km)+' '+t.km:'—'}</td><td>${esc(tr(e.name))}<div style="color:#555;font-size:11px">${esc(tr(e.cat))}</div></td><td class="num">${mon(e.cost)}</td><td>${detStr(e.x,L)?`<div class="det">${esc(detStr(e.x,L))}</div>`:''}${e.note?lk(e.note):''}</td></tr>`).join('')+`<tr><th colspan="3">${t.total}</th><th class="num">${mon(total)}</th><th></th></tr></table>`:`<p>${t.none}</p>`;
  $('rep').lang=L;
  $('rep').innerHTML=`${toolbar()}
  <h1>${t.title}</h1><div>${esc(v.name)}. ${t.made}: ${df(today())}</div>
  <h2>${t.veh}</h2><table class="kv">
  <tr><td>${t.type}</td><td>${t.types[v.type]||''}</td></tr><tr><td>${t.buy}</td><td>${df(v.buyDate)}</td></tr>${v.price!=null?`<tr><td>${t.price}</td><td>${mon(v.price)}</td></tr>`:''}
  <tr><td>${t.buyKm}</td><td>${nf(v.buyKm)} ${t.km}</td></tr><tr><td>${t.odo}</td><td>${nf(v.odo)} ${t.km}</td></tr>
  <tr><td>${t.drv}</td><td>${nf(Math.max(0,v.odo-v.buyKm))} ${t.km}</td></tr><tr><td>${t.own}</td><td>${own}</td></tr>${(v.panels||[]).length?`<tr><td>${t.panel}</td><td>${v.panels.map(p=>`${df(p.d)}: ${nf(p.old)} → ${nf(p.nw)} ${t.km}`).join('<br>')}</td></tr>`:''}</table>
  <h2>${t.docs}</h2><table class="kv">${DOCS.map(([k])=>`<tr><td>${t.dn[k]}</td><td>${ds(k)}</td></tr>`).join('')}</table>
  <h2>${t.costs}</h2><table class="kv"><tr><td>${t.maint}</td><td>${mon(total)}</td></tr>${v.price!=null?`<tr><td>${t.price}</td><td>${mon(v.price)}</td></tr><tr><td>${t.all}</td><td>${mon(total+v.price)}</td></tr>`:''}</table>${catRows.length?`<table><tr><th>${t.byCat}</th><th>${t.cost}</th></tr>${catRows.map(c=>`<tr><td>${esc(tr(c[0]))}</td><td class="num">${mon(c[1])}</td></tr>`).join('')}</table>`:''}
  <h2>${t.state}</h2>${stTbl||`<p>${t.none}</p>`}
  <h2>${t.hist}</h2>${hTbl}`;
}

let ME=null,bootGen=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(p,method='GET',body){
  const r=await fetch('api/'+p,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error(j.error||('Ошибка '+r.status)),{status:r.status});
  return j;
}
async function loadState(){
  const x=await api('state');S=x&&Array.isArray(x.v)?x:{cur:null,v:[]};
  const bad=S.v.some(v=>v.cc&&(/\d/.test(v.cc)||String(v.cc).trim().length>4));
  S.v.forEach(ensure);loaded=true;if(bad)save();view='home';setSync('Подключено к MySQL');render();
}
async function boot(){
  const g=++bootGen;let st=null;
  for(let i=0;i<15&&!st;i++){try{st=await api('status')}catch(e){$('main').innerHTML='<div class="empty">Подключаюсь к приложению…</div>';await sleep(2000)}}
  if(!st){$('main').innerHTML='<div class="empty">Не удалось связаться с сервером.<br><br><button class="p" onclick="location.reload()">Повторить</button></div>';return}
  if(!st.ready){
    if(st.configured&&st.connecting){
      $('main').innerHTML=`<div class="auth card"><h1>Подключаюсь к базе…</h1><p class="meta">${esc(st.current.host)}:${st.current.port}, база «${esc(st.current.database)}». При первом запуске MySQL стартует до минуты.</p>${st.error?`<p class="msg bad">${esc(st.error)}</p>`:''}<div class="btnr"><button id="sChange">Изменить настройки базы</button></div></div>`;
      $('sChange').onclick=()=>showSetup(st);
      await sleep(2500);if(g===bootGen)return boot();return;
    }
    return showSetup(st);
  }
  if(!st.user)return showAuth(st);
  ME=st.user;
  try{await loadState()}catch(e){showAuth(st)}
}

function showAuth(st,mode){
  const reg=mode==='reg'||!st.hasUsers;
  $('main').innerHTML=`<div class="auth card"><h1>${reg?(st.hasUsers?'Регистрация':'Создайте первого пользователя'):'Вход'}</h1>
  <p class="meta">${!st.hasUsers?'Этот пользователь станет администратором. У каждого пользователя свой транспорт и свои записи.':reg?'У каждого пользователя свой транспорт и свои записи.':'Войдите в свой аккаунт.'}</p>
  <div class="form"><label>Логин<input id="aL" autocomplete="username"></label><label>Пароль<input id="aP" type="password" autocomplete="${reg?'new-password':'current-password'}"></label>${reg?'<label>Повторите пароль<input id="aP2" type="password" autocomplete="new-password"></label>':''}</div>
  <div class="msg bad" id="aM"></div>
  <div class="btnr"><button class="p" id="aGo">${reg?'Создать аккаунт':'Войти'}</button>${st.hasUsers?`<button id="aSw">${reg?'У меня есть аккаунт':'Регистрация'}</button>`:''}</div></div>`;
  const go=async()=>{
    const l=$('aL').value.trim(),p=$('aP').value;
    if(reg&&p!==$('aP2').value){$('aM').textContent='Пароли не совпадают';return}
    try{const r=await api('auth/'+(reg?'register':'login'),'POST',{login:l,password:p});ME=r.user;await loadState()}catch(e){$('aM').textContent=e.message}
  };
  $('aGo').onclick=go;
  ['aL','aP','aP2'].forEach(i=>{const el=$(i);if(el)el.onkeydown=ev=>{if(ev.key==='Enter')go()}});
  if(st.hasUsers)$('aSw').onclick=()=>showAuth(st,reg?'login':'reg');
  $('aL').focus();
}
boot();
</script>
</body>
</html>
