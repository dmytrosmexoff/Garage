tagline: Учёт обслуживания автомобиля, мотоцикла и мопеда
description: >-
  Журнал обслуживания транспорта с хранением данных в MySQL.
  Список расходников по категориям, история замен со стоимостью и комментариями
  (место замены, ссылка на Google Карты), график пробега по дням,
