releaseNotes: "Интерфейс разделён на файлы HTML, CSS и JS, сжатие и кэш ответов сервера. Главная: транспорт карточками по два в ряд и окно выбора типа. QR-лист скачивается картинкой. Страница мастера упрощена, полный перевод на 4 языка."
