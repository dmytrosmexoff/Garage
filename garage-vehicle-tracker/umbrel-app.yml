defaultPassword: ""
releaseNotes: "Единый фирменный стиль по всему сайту, карточки транспорта по центру (1, 2 или 3 и больше в ряд), защита ссылки QR: предупреждение о закрытии старого листа и проверка адреса. Интерфейс разделён на HTML, CSS и JS, сжатие ответов, полный перевод на 4 языка."
